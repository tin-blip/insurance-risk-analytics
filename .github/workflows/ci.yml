name: CI

on:
  push:
    branches:
      - main
      - task-1
      - task-2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Run linting
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest